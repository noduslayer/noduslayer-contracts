name: contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: contracts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: forge fmt --check src test script
      - run: forge lint
      - run: forge build --sizes
      - run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci

      # Deterministic tests only: fuzz and invariant gas moves with the seed.
      - name: gas snapshot
        run: forge snapshot --check --tolerance 2 --no-match-test 'testFuzz|invariant' --no-match-path 'test/fork/*'
      - name: coverage floor
        run: forge coverage --report summary --no-match-coverage '(script|test)/' --no-match-path 'test/fork/*' | tee /dev/stderr | ./script/coverage-floor.sh 97

      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: medium

      # Consumers pin themselves to abi/, so a signature change that is not exported is a broken contract
      # with the outside world.
      - run: ./abi/export.sh && ./config/build-catalogue.sh
      - name: published artifacts are up to date
        run: git diff --exit-code -- abi/ config/catalogue.json

  # Config pins live mainnet addresses, feeds and measured pool depth, so it rots as the chain moves.
  # This runs against real state to catch that drift rather than discovering it at deploy time.
  fork:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: forge test --match-path 'test/fork/*' -vvv
        env:
          FORK_TESTS: true
