name: contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: contracts

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge fmt --check src test script
      - run: forge lint
      - run: forge build --sizes
      - run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci

      # Consumers pin themselves to abi/, so a signature change that is not exported is a broken contract
      # with the outside world.
      - run: ./abi/export.sh
      - name: abi artifact is up to date
        run: git diff --exit-code -- abi/

  # Config pins live mainnet addresses, feeds and measured pool depth, so it rots as the chain moves.
  # This runs against real state to catch that drift rather than discovering it at deploy time.
  fork:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge test --match-path 'test/fork/*' -vvv
        env:
          FORK_TESTS: true
