[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
fs_permissions = [{ access = "read", path = "./config" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 48
fail_on_revert = false

[profile.ci]
fuzz = { runs = 5_000 }
invariant = { runs = 256, depth = 64 }

[lint]
exclude_lints = ["screaming-snake-case-immutable", "unsafe-cheatcode"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
